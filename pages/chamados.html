<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC TV DASHBOARD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #030508; --card: #0d111a; --header: #161b26;
            --primary: #00d2ff; --ok: #00ff95; --warn: #ffb800; --danger: #ff3333;
            --text-main: #f1f5f9; --text-dim: #94a3b8; --input-bg: #06080c; --whatsapp: #25d366;
        }

        .light-mode {
            --bg: #f8fafc; --card: #ffffff; --header: #e2e8f0;
            --primary: #0284c7; --ok: #16a34a; --warn: #ea580c; --danger: #dc2626;
            --text-main: #0f172a; --text-dim: #64748b; --input-bg: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            padding: 15px; 
            overflow-x: hidden;
            transition: background 0.3s;
        }

        /* LOGIN OTIMIZADO */
        .login-screen { display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .login-card {
            background: var(--card); border: 2px solid var(--header); padding: 40px; border-radius: 24px;
            width: 100%; max-width: 450px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); text-align: center;
        }
        .login-card h1 { color: var(--primary); font-size: 2rem; font-weight: 900; margin-bottom: 30px; }
        .login-error { color: var(--danger); font-size: 1rem; margin-top: 15px; font-weight: bold; }

        /* HEADER ESTILO MONITORAMENTO */
        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px; background: var(--header); border-radius: 16px;
            margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05);
        }
        .logo-area h2 { font-size: 1.6rem; font-weight: 900; color: var(--primary); letter-spacing: -0.5px; }
        .header-actions { display: flex; align-items: center; gap: 15px; }
        
        .nav-btn {
            background: var(--card); color: var(--text-main); border: 1px solid var(--header); padding: 10px 18px;
            border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.9rem; transition: all 0.2s;
        }
        .nav-btn:hover, .nav-btn.active-btn { background: var(--primary); color: #000; border-color: var(--primary); }
        .logout-btn { background: rgba(255,77,77,0.1); color: var(--danger); border-color: transparent; }
        .logout-btn:hover { background: var(--danger); color: #fff; }

        #page-clock { font-family: 'JetBrains Mono'; font-size: 1.6rem; font-weight: 800; color: var(--text-main); background: rgba(255,255,255,0.03); padding: 5px 15px; border-radius: 10px; }

        /* PAINEL ADMIN ADAPTADO */
        .admin-panel { background: var(--card); border: 1px solid var(--header); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
        @media (min-width: 1200px) { .span-2-desktop { grid-column: span 2; } }

        label { font-size: 0.75rem; color: var(--primary); text-transform: uppercase; font-weight: 900; letter-spacing: 0.5px; margin-bottom: 4px; display: block;}
        input, select { 
            background: var(--input-bg); border: 1px solid var(--header); color: var(--text-main); 
            padding: 14px; border-radius: 10px; outline: none; font-size: 1rem; width: 100%; font-weight: 600;
        }
        
        .btn-add { 
            background: var(--ok); color: #000; border: none; border-radius: 10px; 
            cursor: pointer; font-weight: 900; height: 50px; font-size: 1.1rem; margin-top: 15px; width: 100%; letter-spacing: 0.5px;
        }

        /* ESTATÍSTICAS EM DESTAQUE (VISTA DE TV) */
        .stats-bar { 
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 20px;
            padding-top: 20px; border-top: 2px solid var(--header);
        }
        .stat-item { background: var(--input-bg); padding: 12px; border-radius: 12px; text-align: center; border: 1px solid var(--header); }
        .stat-item div { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; font-weight: 900; margin-bottom: 4px; }
        .stat-item span { font-family: 'JetBrains Mono'; font-size: 2rem; font-weight: 800; color: var(--primary); }

        /* TABS GRANDES */
        .tabs { display: flex; gap: 12px; margin-bottom: 20px; }
        .tabs button { 
            flex: 1; background: var(--card); color: var(--text-dim); padding: 16px; 
            border: 2px solid var(--header); border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 1.1rem; letter-spacing: 1px;
        }
        .tabs button.active { border-color: var(--primary); color: var(--primary); background: rgba(0, 210, 255, 0.05); font-weight: 900; }

        /* CARDS DO MONITORAMENTO - FOCO EM LEITURA À DISTÂNCIA */
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 20px; }

        .card { 
            background: var(--card); border: 2px solid var(--header); border-radius: 24px; padding: 22px; 
            border-top: 10px solid var(--ok); position: relative; display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        /* ALERTAS DA TV (PULSANTES) */
        .card.warn { border-top-color: var(--warn); animation: pulse-warn 2s infinite; }
        .card.danger { border-top-color: var(--danger); animation: pulse-danger 1.5s infinite; }
        
        @keyframes pulse-warn {
            0% { box-shadow: 0 0 0 0px rgba(255, 184, 0, 0.2); }
            50% { box-shadow: 0 0 25px 5px rgba(255, 184, 0, 0.4); border-color: var(--warn); }
            100% { box-shadow: 0 0 0 0px rgba(255, 184, 0, 0.2); }
        }
        @keyframes pulse-danger {
            0% { box-shadow: 0 0 0 0px rgba(255, 51, 51, 0.2); }
            50% { box-shadow: 0 0 30px 8px rgba(255, 51, 51, 0.5); border-color: var(--danger); }
            100% { box-shadow: 0 0 0 0px rgba(255, 51, 51, 0.2); }
        }

        .timer-box { background: rgba(0, 0, 0, 0.3); border-radius: 14px; padding: 15px; text-align: center; margin: 15px 0; border: 1px solid var(--header); }
        .timer-val { font-family: 'JetBrains Mono'; font-size: 2.2rem; font-weight: 800; color: var(--primary); display: block; letter-spacing: -1px; }
        .card.warn .timer-val { color: var(--warn); }
        .card.danger .timer-val { color: var(--danger); }

        /* PASSOS DE ESCALONAMENTO GRANDES */
        .step { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--input-bg); padding: 14px 18px; margin: 8px 0; border-radius: 12px; 
            font-size: 1.05rem; border: 2px solid transparent; font-weight: 600;
        }
        .step span b { font-family: 'JetBrains Mono'; font-size: 1.15rem; color: var(--primary); margin-right: 5px;}
        .step.done { opacity: 0.25; background: transparent; border: 1px dashed var(--text-dim); }
        .step.next-to-call { border-color: var(--warn); background: rgba(255, 184, 0, 0.05); animation: pulse-step-border 1.5s infinite; }
        
        @keyframes pulse-step-border {
            0% { border-color: rgba(255, 184, 0, 0.4); }
            50% { border-color: rgba(255, 184, 0, 1); }
            100% { border-color: rgba(255, 184, 0, 0.4); }
        }

        .actions-step { display: flex; gap: 16px; align-items: center; }
        .wa-link { color: var(--whatsapp); font-size: 1.7rem; text-decoration: none; }
        .copy-btn { color: var(--text-dim); font-size: 1.5rem; cursor: pointer; transition: color 0.2s; }
        .copy-btn:hover { color: var(--primary); }

        .log-container { 
            background: rgba(0,0,0,0.2); padding: 12px; border-radius: 10px; 
            font-size: 0.9rem; max-height: 120px; overflow-y: auto; margin: 12px 0; border: 1px solid var(--header);
        }
        .log-item { margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.03); line-height: 1.4; }

        .btn-encerrar { 
            background: var(--ok); color: #000; width: 100%; border: none; 
            border-radius: 12px; padding: 16px; margin-top: 15px; font-weight: 900; font-size: 1.1rem; cursor: pointer; letter-spacing: 0.5px;
        }

        .btn-hist-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-reabrir { background: var(--warn); color: #000; flex: 2; border: none; border-radius: 12px; padding: 15px; font-weight: 800; font-size: 1rem; cursor: pointer; }
        .btn-excluir { background: var(--danger); color: #fff; flex: 1; border: none; border-radius: 12px; padding: 15px; font-weight: 800; font-size: 1rem; cursor: pointer; }

        .hidden { display: none !important; }
        #theme-toggle { background: transparent; border: none; color: var(--primary); cursor: pointer; font-size: 1.5rem; padding: 0 5px; }
        
        /* BOTÃO TV MODE (OCULTAR PAINEL ADMIN) */
        .tv-toggle-btn { background: #6366f1; color: #fff; border: none; }
        .tv-toggle-btn.active-tv { background: #4f46e5; border: 1px solid #fff; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-view" class="login-screen">
        <div class="login-card">
            <h1><i class="fa-solid fa-lock"></i> NOC SECURITY</h1>
            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div class="form-group" style="text-align: left;">
                    <label>Usuário</label>
                    <input type="text" id="login-user" placeholder="user">
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Senha</label>
                    <input type="password" id="login-pass" placeholder="password">
                </div>
                <button class="btn-add" style="margin-top: 5px;" onclick="handleLogin()">ACESSAR PAINEL</button>
            </div>
            <div id="login-error-msg" class="login-error hidden">Usuário ou senha inválidos!</div>
        </div>
    </div>

    <div id="main-view" class="hidden">
        <div class="page-header">
            <div class="logo-area"><h2><i class="fa-solid fa-tower-broadcast"></i> MONITORAMENTO MONITOR NOC</h2></div>
            <div class="header-actions">
                <button class="nav-btn tv-toggle-btn" id="tv-mode-btn" onclick="toggleTVMode()"><i class="fa-solid fa-tv"></i> MODO TV</button>
                <button class="nav-btn" onclick="toggleView('partners')">OPERADORAS</button>
                <div id="page-clock">00:00:00</div>
                <button id="theme-toggle" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
                <button class="nav-btn logout-btn" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>

        <div class="admin-panel" id="admin-panel-area">
            <div class="form-grid">
                <div class="form-group span-2-desktop"><label>Título da Ocorrência</label><input id="titulo" placeholder="Ex: Rompimento Varjota x Fortaleza"></div>
                <div class="form-group"><label>Prot. Pai</label><input id="pai" type="tel" placeholder="Nº Pai"></div>
                <div class="form-group"><label>Prot. Filho</label><input id="filho" type="tel" placeholder="Nº Filho"></div>
                <div class="form-group"><label>Data Início</label><input type="date" id="data_manual"></div>
                <div class="form-group"><label>Hora Início</label><input type="time" id="hora_manual"></div>
                <div class="form-group span-2-desktop">
                    <label>Escopo / Tipo</label>
                    <select id="tipo">
                        <option value="noc">NOC</option>
                        <option value="externa_ne">Externa (NE)</option>
                        <option value="externa_no">Externa (NO)</option>
                        <option value="interna_ne">Interna (NE)</option>
                        <option value="interna_no">Interna (NO)</option>
                    </select>
                </div>
            </div>
            <button class="btn-add" onclick="add()"><i class="fa-solid fa-plus"></i> ABRIR NOVO CHAMADO DE ESCALONAMENTO</button>

            <div class="stats-bar">
                <div class="stat-item"><div>NOC</div><span id="count-noc">0</span></div>
                <div class="stat-item"><div>Ext. NE</div><span id="count-externa_ne">0</span></div>
                <div class="stat-item"><div>Ext. NO</div><span id="count-externa_no">0</span></div>
                <div class="stat-item"><div>Int. NE</div><span id="count-interna_ne">0</span></div>
                <div class="stat-item"><div>Int. NO</div><span id="count-interna_no">0</span></div>
            </div>
        </div>

        <div class="tabs">
            <button id="btn-tab-ativos" class="active" onclick="showTab('ativos')">CHAMADOS CRÍTICOS ATIVOS</button>
            <button id="btn-tab-resolvidos" onclick="showTab('resolvidos')">HISTÓRICO DE RESOLUÇÕES</button>
        </div>

        <div id="ativos" class="grid-cards"></div>
        <div id="resolvidos" class="grid-cards hidden"></div>
    </div>

    <div id="partners-view" class="hidden">
        <div class="page-header">
            <div class="logo-area"><h2><i class="fa-solid fa-handshake"></i> CONTATOS DAS OPERADORAS</h2></div>
            <button class="nav-btn" onclick="toggleView('main')">VOLTAR AO DASHBOARD</button>
        </div>
        <div class="admin-panel">
            <div style="background:var(--input-bg); padding:20px; border-radius:16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; border: 1px solid var(--header)">
                <div><b style="font-size:1.3rem;">Operadora X</b><br><span style="color:var(--text-dim); font-size:1rem;">Suporte Link IP dedicado</span></div>
                <div class="actions-step">
                    <i class="fa-solid fa-copy copy-btn" onclick="copyTel('08005551234', this)"></i>
                    <a href="#" class="wa-link"><i class="fa-brands fa-whatsapp"></i></a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURAÇÃO DE USUÁRIOS ---
    const USERS_DB = {
        "admin": "noc@2026",
        "operador": "noc123"
    };

    // --- CONFIGURAÇÃO E DADOS INICIAIS ---
    const CONFIG_ESCALATION = {
         noc: [
            {h: 0, nome: "NOC", tel: "8836953095"},
            {h: 4, nome: "Augusto Lopes", tel: "5588996430008"},
            {h: 4, nome: "Luiz Fernando", tel: "5591981459871"},
            {h: 6, nome: "Gleison Silva", tel: "5588992195154"},
            {h: 10, nome: "Fernando Gerhardt", tel: "5588994401255"}
        ],
        externa_ne: [
            {h: 0, nome: "Michel Taylon", tel: "5588997357308"},
            {h: 0, nome: "Bruno", tel: "5588998286655"},
            {h: 0, nome: "Erivelton", tel: "5588998283311"},
            {h: 6, nome: "Guilherme Silva", tel: "5588998282323"},
            {h: 8, nome: "Lindon Johnson", tel: "5585991417037"},
            {h: 12, nome: "Valmir Filho", tel: "5588998287071"}
        ],
        externa_no: [
            {h: 0, nome: "Tamires Vitoria", tel: "5591993843282"},
            {h: 0, nome: "Diego Assunção", tel: "5591993904223"},
            {h: 4, nome: "Douglas Martins", tel: "5591993796462"},
            {h: 6, nome: "Guilherme Silva", tel: "5588998282323"},
            {h: 8, nome: "Lindon Johnson", tel: "5585991417037"},
            {h: 12, nome: "Valmir Filho", tel: "5588998287071"}
        ],
        interna_ne: [
            {h: 0, nome: "Eduardo Oliveira", tel: "5588993556007"},
            {h: 0, nome: "Valdemídio", tel: "5588982191541"},
            {h: 4, nome: "Silvio de Moraes", tel: "5588996055060"},
            {h: 6, nome: "João Martins", tel: "5588996649640"},
            {h: 8, nome: "Wescley Costa", tel: "5588994866085"},
            {h: 10, nome: "Iran Júnior", tel: "5588998707256"}
        ],
        interna_no: [
            {h: 0, nome: "Oracenildo", tel: "5591991358874"},
            {h: 4, nome: "Julio Gaia", tel: "5591985938544"},
            {h: 6, nome: "Wescley Costa", tel: "5588994866085"},
            {h: 8, nome: "Iran Júnior", tel: "5588998707256"},
            {h: 10, nome: "Valmir Bertoldo", tel: "5588998287071"}
        ]
    };

    let db = { ativos: {}, resolvidos: {} };
    let BACKUP_SESSION = false; 

    try {
        db.ativos = JSON.parse(localStorage.getItem('noc_ativos')) || {};
        db.resolvidos = JSON.parse(localStorage.getItem('noc_resolvidos')) || {};
    } catch(e) { console.log("Storage local inacessível."); }

    function saveDB() {
        try {
            localStorage.setItem('noc_ativos', JSON.stringify(db.ativos));
            localStorage.setItem('noc_resolvidos', JSON.stringify(db.resolvidos));
        } catch(e) {}
        updateStats();
    }

    function checkAuth() {
        let logado = false;
        try { logado = sessionStorage.getItem('noc_session') === 'true'; } catch(e) { logado = BACKUP_SESSION; }
        if (logado) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('main-view').classList.remove('hidden');
            renderAll();
        } else {
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('main-view').classList.add('hidden');
        }
    }

    window.handleLogin = function() {
        const u = document.getElementById('login-user').value.trim();
        const p = document.getElementById('login-pass').value.trim();
        const errMsg = document.getElementById('login-error-msg');

        if (USERS_DB[u] && USERS_DB[u] === p) {
            BACKUP_SESSION = true;
            try { sessionStorage.setItem('noc_session', 'true'); } catch(e) {}
            errMsg.classList.add('hidden');
            document.getElementById('login-user').value = "";
            document.getElementById('login-pass').value = "";
            checkAuth();
        } else { errMsg.classList.remove('hidden'); }
    };

    window.handleLogout = function() {
        BACKUP_SESSION = false;
        try { sessionStorage.removeItem('noc_session'); } catch(e) {}
        checkAuth();
    };

    function initDateTimeFields() {
        const agora = new Date();
        const campoData = document.getElementById('data_manual');
        const campoHora = document.getElementById('hora_manual');
        if(campoData) campoData.value = agora.toISOString().split('T')[0];
        if(campoHora) campoHora.value = agora.toTimeString().slice(0,5);
    }

    window.toggleTheme = () => document.body.classList.toggle('light-mode');
    
    // Toggle Modo TV (Oculta Painel de controle superior para focar nos alertas)
    window.toggleTVMode = function() {
        const panel = document.getElementById('admin-panel-area');
        const btn = document.getElementById('tv-mode-btn');
        panel.classList.toggle('hidden');
        btn.classList.toggle('active-tv');
    }

    setInterval(() => { 
        const clockEl = document.getElementById('page-clock');
        if(clockEl) clockEl.innerText = new Date().toLocaleTimeString('pt-BR'); 
    }, 1000);

    function formatDuration(ms) {
        if (ms < 0) return "0h 0m 0s";
        const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000), s = Math.floor((ms%60000)/1000);
        return `${h}h ${m}m ${s}s`;
    }

    window.copyTel = (num, el) => {
        navigator.clipboard.writeText(num).then(() => {
            const originalClass = el.className;
            el.className = "fa-solid fa-check copy-btn";
            el.style.color = "var(--ok)";
            setTimeout(() => { el.className = originalClass; el.style.color = ""; }, 1500);
        });
    };

    window.copyTextNotification = (id, nome) => {
        const item = db.ativos[id] || db.resolvidos[id];
        if(!item) return;
        const textoAcionamento = `🚨 *NOTIFICAÇÃO DE ESCALONAMENTO - NOC*\n\n*Ocorrência:* ${item.titulo}\n*Falha Iniciada em:* ${item.dataStr}\n*Protocolo Pai:* ${item.pai}\n*Protocolo Filho:* ${item.filho}\n\nOlá ${nome}, este chamado está sob sua alçada no momento. Favor verificar.`;
        navigator.clipboard.writeText(textoAcionamento).then(() => {
            alert(`Mensagem pronta copiada para acionamento de ${nome}!`);
        });
    };

    window.toggleView = (v) => {
        document.getElementById('main-view').classList.toggle('hidden', v==='partners');
        document.getElementById('partners-view').classList.toggle('hidden', v==='main');
    };

    window.add = function(){
        const t = document.getElementById("titulo").value, p = document.getElementById("pai").value;
        if(!t || !p) return alert("Título e Protocolo Pai são obrigatórios!");
        
        const fullDate = new Date(`${document.getElementById("data_manual").value}T${document.getElementById("hora_manual").value}`);
        const id = 'id' + Date.now();
        
        db.ativos[id] = { 
            titulo: t, pai: p, filho: document.getElementById("filho").value || "N/A", 
            tipo: document.getElementById("tipo").value, 
            inicio: fullDate.getTime(), dataStr: fullDate.toLocaleString('pt-BR'), 
            escalado: [], comentarios: [] 
        };
        
        document.getElementById("titulo").value = "";
        saveDB(); renderAll();
    };

    window.addComment = (id) => {
        const inp = document.getElementById(`in-${id}`); 
        if(!inp.value) return;
        if(!db.ativos[id].comentarios) db.ativos[id].comentarios = [];
        db.ativos[id].comentarios.push({ 
            texto: inp.value, 
            hora: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) 
        });
        saveDB(); renderAll();
    };

    window.toggleEscala = (id, h) => {
        let list = db.ativos[id].escalado || [];
        db.ativos[id].escalado = list.includes(h) ? list.filter(x => x !== h) : [...list, h];
        saveDB(); renderAll();
    };

    window.finalizar = (id) => { 
        db.resolvidos[id] = { ...db.ativos[id], fim: Date.now() }; 
        delete db.ativos[id]; 
        saveDB(); renderAll(); 
    };

    window.reabrir = (id) => { 
        const {fim, ...rest} = db.resolvidos[id]; 
        db.ativos[id] = rest; 
        delete db.resolvidos[id]; 
        saveDB(); renderAll(); 
    };

    window.apagar = (id) => { 
        if(confirm("Deseja expurgar do histórico de monitoramento?")) {
            delete db.resolvidos[id]; 
            saveDB(); renderAll(); 
        }
    };

    function renderCard(id, data, containerId) {
        const isResolvido = containerId === 'resolvidos';
        const div = document.createElement("div");
        div.className = `card ${isResolvido ? 'finalizado' : 'ativo'}`; 
        div.id = id;
        
        const logsHTML = (data.comentarios || []).map(c => `<div class="log-item"><b style="color:var(--primary)">[${c.hora}]</b> ${c.texto}</div>`).reverse().join('');
        const stepsHTML = (CONFIG_ESCALATION[data.tipo] || []).map(e => {
            const isDone = (data.escalado || []).includes(e.h);
            return `
            <div class="step ${isDone ? 'done' : ''}" data-h="${e.h}" onclick="${!isResolvido ? `window.toggleEscala('${id}', ${e.h})` : ''}">
                <span><b>${e.h}h</b> - ${e.nome}</span>
                <div class="actions-step">
                    <i class="fa-solid fa-message copy-btn" title="Copiar Texto" style="color: var(--primary); margin-right: 6px;" onclick="event.stopPropagation(); window.copyTextNotification('${id}', '${e.nome}')"></i>
                    <i class="fa-solid fa-copy copy-btn" onclick="event.stopPropagation(); window.copyTel('${e.tel}', this)"></i>
                    <a href="https://wa.me/${e.tel}" target="_blank" class="wa-link" onclick="event.stopPropagation()"><i class="fa-brands fa-whatsapp"></i></a>
                </div>
            </div>`;
        }).join('');

        div.innerHTML = `
            <div style="font-size:0.85rem; color:var(--text-dim); font-weight:700;">INÍCIO FALHA: ${data.dataStr}</div>
            <div style="font-weight:900; font-size:1.4rem; color:var(--primary); margin: 5px 0;">${data.titulo}</div>
            <div style="font-size:0.95rem; opacity:0.9; font-weight: 600;">PAI: ${data.pai} | FILHO: ${data.filho} <span style="background:var(--header); padding:2px 8px; border-radius:6px; font-size:0.75rem; color:var(--primary); margin-left:5px">${data.tipo.toUpperCase()}</span></div>
            <div class="timer-box"><span class="timer-val" id="timer-${id}">${isResolvido ? formatDuration(data.fim - data.inicio) : '...'}</span></div>
            <div class="log-container">${logsHTML || 'Sem registros no log.'}</div>
            ${!isResolvido ? `<div style="display:flex; gap:5px;"><input type="text" id="in-${id}" placeholder="Adicionar nota técnica..." style="flex:1; padding:10px; font-size:14px;"><button class="nav-btn" style="min-width:60px" onclick="window.addComment('${id}')">OK</button></div>` : ''}
            <div style="margin-top:12px;">${stepsHTML}</div>
            ${!isResolvido ? `<button class="btn-encerrar" onclick="window.finalizar('${id}')"><i class="fa-solid fa-square-check"></i> ENCERRAR OCORRÊNCIA</button>` : 
            `<div class="btn-hist-group">
                <button class="btn-reabrir" onclick="window.reabrir('${id}')">REABRIR REPARO</button>
                <button class="btn-excluir" onclick="window.apagar('${id}')"><i class="fa-solid fa-trash"></i></button>
            </div>`}
        `;
        
        const container = document.getElementById(containerId);
        if(container) container.prepend(div);
    }

    function renderAll() {
        const ativosContainer = document.getElementById("ativos");
        const resolvidosContainer = document.getElementById("resolvidos");
        if(ativosContainer) ativosContainer.innerHTML = "";
        if(resolvidosContainer) resolvidosContainer.innerHTML = "";
        
        Object.keys(db.ativos).forEach(id => renderCard(id, db.ativos[id], "ativos"));
        Object.keys(db.resolvidos).forEach(id => renderCard(id, db.resolvidos[id], "resolvidos"));
        updateStats();
    }

    function updateStats() {
        const counts = { noc: 0, externa_ne: 0, externa_no: 0, interna_ne: 0, interna_no: 0 };
        Object.values(db.ativos).forEach(item => { if(counts.hasOwnProperty(item.tipo)) counts[item.tipo]++; });
        Object.keys(counts).forEach(tipo => { 
            const el = document.getElementById(`count-${tipo}`);
            if(el) el.innerText = counts[tipo]; 
        });
    }

    window.showTab = (t) => {
        document.getElementById("ativos").classList.toggle("hidden", t!=='ativos');
        document.getElementById("resolvidos").classList.toggle("hidden", t!=='resolvidos');
        document.getElementById("btn-tab-ativos").classList.toggle("active", t==='ativos');
        document.getElementById("btn-tab-resolvidos").classList.toggle("active", t==='resolvidos');
    };

    // --- LOOP DE TIMERS E CRITICIDADE PULSANTE PARA MONITOR DE TV ---
    setInterval(() => {
        let logado = false;
        try { logado = sessionStorage.getItem('noc_session') === 'true'; } catch(e) { logado = BACKUP_SESSION; }
        if(!logado) return;

        const now = Date.now();
        Object.keys(db.ativos).forEach(id => {
            const data = db.ativos[id];
            const diffH = (now - data.inicio) / 3600000;
            const card = document.getElementById(id);
            if(!card) return;

            const timerEl = document.getElementById(`timer-${id}`);
            if(timerEl) timerEl.innerText = formatDuration(now - data.inicio);

            // Regras visuais de criticidade para TV (Aviso a partir de 8 horas, crítico com 10)
            card.classList.toggle('warn', diffH >= 8 && diffH < 10);
            card.classList.toggle('danger', diffH >= 10);

            const escFeito = data.escalado || [];
            let alertSet = false;
            card.querySelectorAll('.step').forEach(step => {
                const h = parseInt(step.dataset.h);
                const isNext = diffH >= h && !escFeito.includes(h) && !alertSet;
                step.classList.toggle('next-to-call', isNext);
                if(isNext) alertSet = true;
            });
        });
    }, 1000);

    document.addEventListener("DOMContentLoaded", function() {
        initDateTimeFields();
        checkAuth();
        const passInput = document.getElementById('login-pass');
        if(passInput) {
            passInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleLogin();
            });
        }
    });
</script>
</body>
</html>
