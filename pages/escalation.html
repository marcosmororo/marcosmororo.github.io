<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel NOC - Escalation & Áudio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #16a34a;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin-top: 0;
            color: var(--text);
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .form-group { margin-bottom: 14px; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .preview-box {
            background: #090d16;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 6px;
            font-family: "Courier New", Courier, monospace;
            white-space: pre-wrap;
            min-height: 260px;
            font-size: 0.875rem;
            border: 1px solid var(--border);
        }

        .actions {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background-color: var(--accent-hover); }

        button.btn-audio { background-color: var(--success); }
        button.btn-audio:hover { background-color: #15803d; }

        button.btn-stop { background-color: #dc2626; }
        button.btn-stop:hover { background-color: #b91c1c; }

        .status-msg {
            font-size: 0.85rem;
            color: #38bdf8;
            margin-top: 8px;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Formulário -->
    <div class="card">
        <h2>🚨 Escalation de Incidente - NOC</h2>
        <form id="nocForm">
            <div class="form-group">
                <label for="tipo">Tipo de Evento</label>
                <select id="tipo">
                    <option value="ROMPIMENTO DE FIBRA">🔴 Rompimento de Fibra</option>
                    <option value="ATENUAÇÃO DE SINAL">🟠 Atenuação de Sinal</option>
                    <option value="FALHA DE ENERGIA">⚡ Falha de Energia</option>
                    <option value="INCIDENTE CRÍTICO">⚠️ Incidente Crítico / Outro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="chamado">Número do Chamado / Ticket</label>
                <input type="text" id="chamado" placeholder="Ex: INC-982341">
            </div>

            <div class="form-group">
                <label for="trecho">Trecho / Localidade Afetada</label>
                <input type="text" id="trecho" placeholder="Ex: Trecho SP-Rio (km 120 / PoP Centro)">
            </div>

            <div class="form-group">
                <label for="impacto">Impacto Identificado</label>
                <input type="text" id="impacto" placeholder="Ex: 15 PoPs indisponíveis / ~3.000 clientes afetados">
            </div>

            <div class="form-group">
                <label for="pessoa">Pessoa Acionada Anteriormente</label>
                <input type="text" id="pessoa" placeholder="Ex: João Silva (Supervisor de Campo / Plantonista)">
            </div>

            <div class="form-group">
                <label for="etr">Previsão de Normalização (ETR)</label>
                <input type="text" id="etr" placeholder="Ex: 16:30 ou A definir">
            </div>

            <div class="form-group">
                <label for="atualizacao">Última Atualização</label>
                <textarea id="atualizacao" rows="3" placeholder="Ex: [14:15] O responsável informou que a equipe já está no local efetuando os testes de fusão."></textarea>
            </div>
        </form>
    </div>

    <!-- Preview e Ações -->
    <div class="card">
        <h2>📋 Mensagem Formatada</h2>
        
        <div class="preview-box" id="previewText"></div>
        
        <div class="actions">
            <button onclick="copiarTexto()">📋 Copiar Texto para Envio</button>
            <div class="btn-row">
                <button class="btn-audio" onclick="ouvirAudio()">🔊 Ouvir Áudio (Voz)</button>
                <button class="btn-stop" onclick="pararAudio()">⏹️ Parar</button>
            </div>
        </div>

        <div id="statusMsg" class="status-msg"></div>
    </div>
</div>

<script>
    function gerarMensagem() {
        const tipo = document.getElementById('tipo').value || 'INCIDENTE';
        const chamado = document.getElementById('chamado').value.trim() || 'N/A';
        const trecho = document.getElementById('trecho').value.trim() || 'Não informado';
        const impacto = document.getElementById('impacto').value.trim() || 'Em mensuração';
        const pessoa = document.getElementById('pessoa').value.trim() || 'Ninguém registrado';
        const etr = document.getElementById('etr').value.trim() || 'A definir';
        const atualizacao = document.getElementById('atualizacao').value.trim() || 'Monitoramento inicial pelo NOC.';

        const mensagem = `🚨 [NOC ALERTA] - ESCALATION DE INCIDENTE

📌 Chamado: #${chamado}
⚠️ Tipo: ${tipo}
📍 Trecho / Local: ${trecho}
📉 Impacto: ${impacto}

🔄 Última Atualização:
${atualizacao}

👤 Pessoa Acionada Anteriormente: ${pessoa}
⏱️ ETR (Previsão): ${etr}

---
CC: @Supervisão NOC @Gestão de Redes`;

        document.getElementById('previewText').innerText = mensagem;
    }

    function copiarTexto() {
        const texto = document.getElementById('previewText').innerText;
        navigator.clipboard.writeText(texto).then(() => {
            mostrarStatus('✅ Texto copiado com sucesso!');
        }).catch(() => {
            mostrarStatus('❌ Erro ao copiar. Selecione o texto manualmente.');
        });
    }

    function ouvirAudio() {
        pararAudio();

        if (!('speechSynthesis' in window)) {
            mostrarStatus('❌ Seu navegador não suporta leitura de voz nativa.');
            return;
        }

        const texto = document.getElementById('previewText').innerText;
        
        // Remove caracteres especiais/emojis para que a voz leia de forma fluida
        const textoParaLeitura = texto
            .replace(/[🚨📌⚠️📍📉🔄👤⏱️---]/g, '')
            .replace(/CC:/g, 'Com cópia para:');

        const utterance = new SpeechSynthesisUtterance(textoParaLeitura);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;

        utterance.onstart = () => mostrarStatus('🔊 Reproduzindo áudio do comunicado...');
        utterance.onend = () => mostrarStatus('✅ Leitura finalizada.');
        utterance.onerror = () => mostrarStatus('❌ Ocorreu um erro ao reproduzir o áudio.');

        window.speechSynthesis.speak(utterance);
    }

    function pararAudio() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            mostrarStatus('');
        }
    }

    function mostrarStatus(msg) {
        const statusEl = document.getElementById('statusMsg');
        statusEl.innerText = msg;
        if(msg.startsWith('✅')) {
            setTimeout(() => { statusEl.innerText = ''; }, 4000);
        }
    }

    // Event Listeners em todos os campos para atualização instantânea
    const campos = ['tipo', 'chamado', 'trecho', 'impacto', 'pessoa', 'etr', 'atualizacao'];
    campos.forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('input', gerarMensagem);
        el.addEventListener('change', gerarMensagem);
    });

    // Executa no carregamento da página
    window.onload = function() {
        gerarMensagem();
    };
</script>

</body>
</html>
