<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC - Central de Escalation</title>
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: #161e2e;
            --bg-input: #0f172a;
            --bg-preview: #030712;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #1e293b;
            --border-focus: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 32px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .card-header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header h2 {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .preview-box {
            background-color: var(--bg-preview);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace;
            font-size: 0.875rem;
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre-wrap;
            flex-grow: 1;
            min-height: 380px;
        }

        .actions {
            margin-top: 20px;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .status-badge {
            margin-top: 12px;
            font-size: 0.85rem;
            text-align: center;
            height: 20px;
            color: var(--accent-green);
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Formulário -->
    <div class="card">
        <div class="card-header">
            <h2>⚙️ Parâmetros do Incidente</h2>
        </div>
        
        <div class="form-group">
            <label for="tipo">Tipo de Evento Crítico</label>
            <select id="tipo">
                <option value="🔴 ROMPIMENTO DE FIBRA OPTICA">🔴 Rompimento de Fibra Óptica</option>
                <option value="🟠 ATENUAÇÃO DE SINAL (DEGRADAÇÃO)">🟠 Atenuação de Sinal / Sinal Baixo</option>
                <option value="⚡ FALHA DE ENERGIA (AC/DC)">⚡ Falha de Energia / PoP Off</option>
                <option value="⚠️ INCIDENTE DE INFRAESTRUTURA">⚠️ Outra Falha Crítica</option>
            </select>
        </div>

        <div class="form-group">
            <label for="chamado">Número do Chamado / Ticket</label>
            <input type="text" id="chamado" placeholder="Ex: INC-2026-89412">
        </div>

        <div class="form-group">
            <label for="trecho">Trecho / Localidade Afetada</label>
            <input type="text" id="trecho" placeholder="Ex: Backbone SP-RJ | Trecho Km 142 (PoP Campinas)">
        </div>

        <div class="form-group">
            <label for="impacto">Impacto Operational Identificado</label>
            <input type="text" id="impacto" placeholder="Ex: Indisponibilidade de 12 PoPs / ~4.500 Clientes Afetados">
        </div>

        <div class="form-group">
            <label for="pessoa">Pessoa Acionada Anteriormente</label>
            <input type="text" id="pessoa" placeholder="Ex: Carlos Eduardo (Plantão de Infra / Campo)">
        </div>

        <div class="form-group">
            <label for="etr">Previsão de Normalização (ETR)</label>
            <input type="text" id="etr" placeholder="Ex: 17:30 BRT ou Em Diagnóstico">
        </div>

        <div class="form-group">
            <label for="atualizacao">Última Atualização Operacional</label>
            <textarea id="atualizacao" placeholder="Ex: Téc. Carlos no local. Fibra de 72FO rompida por terceiros. Preparando caixa de fusão."></textarea>
        </div>
    </div>

    <!-- Preview e Cópia -->
    <div class="card">
        <div class="card-header">
            <h2>📢 Comunicado Formatado</h2>
        </div>
        
        <div class="preview-box" id="previewText"></div>
        
        <div class="actions">
            <button id="btnCopiar">
                📋 Copiar Mensagem de Escalation
            </button>
        </div>
        
        <div class="status-badge" id="statusMsg"></div>
    </div>
</div>

<script>
    // Função principal que gera o texto formatado
    function atualizarMensagem() {
        const tipo = document.getElementById('tipo').value;
        const chamado = document.getElementById('chamado').value.trim() || 'N/A';
        const trecho = document.getElementById('trecho').value.trim() || 'Não informado';
        const impacto = document.getElementById('impacto').value.trim() || 'Em dimensionamento';
        const pessoa = document.getElementById('pessoa').value.trim() || 'Não registrado';
        const etr = document.getElementById('etr').value.trim() || 'A definir';
        const atualizacao = document.getElementById('atualizacao').value.trim() || 'Acompanhamento inicial pelo NOC.';

        const template = `🚨 [ESCALATION NOC] - ALERTA CRÍTICO

📌 TICKET: #${chamado}
🚨 EVENTO: ${tipo}
📍 TRECHO/LOCAL: ${trecho}
📉 IMPACTO: ${impacto}

📋 ÚLTIMA ATUALIZAÇÃO:
└ ${atualizacao}

👤 ACIONADO ANTERIORMENTE: ${pessoa}
⏱️ PREVISÃO (ETR): ${etr}

--------------------------------------------------
⚠️ ATENÇÃO SUPERVISÃO & GESTÃO DE REDES`;

        document.getElementById('previewText').textContent = template;
    }

    // Função de cópia para a área de transferência
    function copiarTexto() {
        const texto = document.getElementById('previewText').textContent;
        
        navigator.clipboard.writeText(texto).then(() => {
            const status = document.getElementById('statusMsg');
            status.textContent = '✅ Mensagem copiada com sucesso!';
            setTimeout(() => { status.textContent = ''; }, 3000);
        }).catch(() => {
            alert('Não foi possível copiar automaticamente. Selecione o texto e copie manualmente.');
        });
    }

    // Garante o carregamento dos eventos após a renderização da página
    document.addEventListener('DOMContentLoaded', () => {
        const ids = ['tipo', 'chamado', 'trecho', 'impacto', 'pessoa', 'etr', 'atualizacao'];
        
        // Adiciona escuta em tempo real para todos os inputs
        ids.forEach(id => {
            const inputEl = document.getElementById(id);
            if (inputEl) {
                inputEl.addEventListener('input', atualizarMensagem);
                inputEl.addEventListener('change', atualizarMensagem);
            }
        });

        // Configura o botão de cópia
        document.getElementById('btnCopiar').addEventListener('click', copiarTexto);

        // Gera a primeira versão com dados vazios/padrão
        atualizarMensagem();
    });
</script>

</body>
</html>
