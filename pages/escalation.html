<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel NOC - Escalation & Áudio via IA</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #16a34a;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin-top: 0;
            color: var(--text);
            font-size: 1.25rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .form-group { margin-bottom: 14px; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .preview-box {
            background: #090d16;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 6px;
            font-family: "Courier New", Courier, monospace;
            white-space: pre-wrap;
            min-height: 240px;
            font-size: 0.875rem;
            border: 1px solid var(--border);
        }

        .actions {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background-color: var(--accent-hover); }

        button.btn-ai { background-color: var(--success); }
        button.btn-ai:hover { background-color: #15803d; }

        .api-config {
            background: #090d16;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            border: 1px dashed var(--border);
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        .status-msg {
            font-size: 0.85rem;
            color: #38bdf8;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Formulário -->
    <div class="card">
        <h2>⚡ Painel de Escalation NOC</h2>
        <form id="nocForm">
            <div class="form-group">
                <label for="tipo">Tipo de Evento</label>
                <select id="tipo" onchange="gerarMensagem()">
                    <option value="ROMPIMENTO DE FIBRA">🔴 Rompimento de Fibra</option>
                    <option value="ATENUAÇÃO DE SINAL">🟠 Atenuação de Sinal</option>
                    <option value="FALHA DE ENERGIA">⚡ Falha de Energia</option>
                    <option value="INCIDENTE CRÍTICO">⚠️ Incidente Crítico / Outro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="chamado">Número do Chamado / Ticket</label>
                <input type="text" id="chamado" placeholder="Ex: INC-982341" oninput="gerarMensagem()">
            </div>

            <div class="form-group">
                <label for="trecho">Trecho / Localidade Afetada</label>
                <input type="text" id="trecho" placeholder="Ex: Trecho SP-Rio (km 120 / PoP Centro)" oninput="gerarMensagem()">
            </div>

            <div class="form-group">
                <label for="impacto">Impacto Identificado</label>
                <input type="text" id="impacto" placeholder="Ex: 15 PoPs indisponíveis / ~3.000 clientes afetados" oninput="gerarMensagem()">
            </div>

            <div class="form-group">
                <label for="pessoa">Pessoa Acionada Anteriormente</label>
                <input type="text" id="pessoa" placeholder="Ex: João Silva (Supervisor de Campo / Plantonista)" oninput="gerarMensagem()">
            </div>

            <div class="form-group">
                <label for="etr">Previsão de Normalização (ETR)</label>
                <input type="text" id="etr" placeholder="Ex: 16:30 ou A definir" oninput="gerarMensagem()">
            </div>

            <div class="form-group">
                <label for="atualizacao">Última Atualização</label>
                <textarea id="atualizacao" rows="3" placeholder="Ex: [14:15] O responsável informou que a equipe já está no local efetuando os testes de fusão." oninput="gerarMensagem()"></textarea>
            </div>
        </form>
    </div>

    <!-- Preview e Geração com IA -->
    <div class="card">
        <h2>📄 Mensagem & Áudio via IA</h2>
        
        <!-- Configuração da Chave da OpenAI -->
        <div class="api-config">
            <label for="apiKey">🔑 Chave de API OpenAI (sk-...)</label>
            <input type="password" id="apiKey" placeholder="Cole sua API Key aqui para gerar áudio realista">
        </div>

        <div class="preview-box" id="previewText">Aguardando preenchimento...</div>
        
        <div class="actions">
            <button onclick="copiarTexto()">📋 Copiar Mensagem de Texto</button>
            <button class="btn-ai" onclick="gerarAudioIA()">🎙️ Gerar Áudio com IA (OpenAI TTS)</button>
        </div>

        <div id="statusMsg" class="status-msg"></div>
        <audio id="audioPlayer" controls style="display: none;"></audio>
    </div>
</div>

<script>
    function gerarMensagem() {
        const tipo = document.getElementById('tipo').value;
        const chamado = document.getElementById('chamado').value || 'N/A';
        const trecho = document.getElementById('trecho').value || 'Não informado';
        const impacto = document.getElementById('impacto').value || 'Em mensuração';
        const pessoa = document.getElementById('pessoa').value || 'Ninguém registrado';
        const etr = document.getElementById('etr').value || 'A definir';
        const atualizacao = document.getElementById('atualizacao').value || 'Monitoramento inicial pelo NOC.';

        const mensagem = `🚨 [NOC ALERTA] - ESCALATION DE INCIDENTE

📌 Chamado: #${chamado}
⚠️ Tipo: ${tipo}
📍 Trecho / Local: ${trecho}
📉 Impacto: ${impacto}

🔄 Última Atualização:
${atualizacao}

👤 Pessoa Acionada Anteriormente: ${pessoa}
⏱️ ETR (Previsão): ${etr}

---
CC: @Supervisão NOC @Gestão de Redes`;

        document.getElementById('previewText').innerText = mensagem;
    }

    function copiarTexto() {
        const texto = document.getElementById('previewText').innerText;
        navigator.clipboard.writeText(texto).then(() => {
            const status = document.getElementById('statusMsg');
            status.innerText = '✅ Texto copiado para a área de transferência!';
            setTimeout(() => status.innerText = '', 3000);
        });
    }

    async function gerarAudioIA() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const status = document.getElementById('statusMsg');
        const audioPlayer = document.getElementById('audioPlayer');

        if (!apiKey) {
            alert('Por favor, insira sua chave de API OpenAI para gerar o áudio.');
            return;
        }

        const texto = document.getElementById('previewText').innerText;
        
        // Limpa caracteres especiais do texto para uma leitura natural pela IA
        const textoParaIa = texto
            .replace(/[🚨📌⚠️📍📉🔄👤⏱️---]/g, '')
            .replace(/CC:/g, 'Atenção supervisores:');

        status.innerText = '⏳ Solicitando áudio à IA... Aguarde.';
        audioPlayer.style.display = 'none';

        try {
            const response = await fetch('https://api.openai.com/v1/audio/speech', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: 'tts-1',
                    input: textoParaIa,
                    voice: 'onyx', // Opções de vozes profissionais: 'onyx', 'alloy', 'echo', 'fable'
                    speed: 1.0
                })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error?.message || 'Erro ao comunicar com a OpenAI.');
            }

            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);

            audioPlayer.src = audioUrl;
            audioPlayer.style.display = 'block';
            audioPlayer.play();
            status.innerText = '✅ Áudio gerado com sucesso!';

        } catch (error) {
            console.error(error);
            status.innerText = '❌ Erro ao gerar áudio: ' + error.message;
        }
    }

    // Inicialização
    gerarMensagem();
</script>

</body>
</html>
